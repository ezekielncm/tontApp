groups:
  - name: tontapp_alerts
    rules:
      # ── CPU > 80% ────────────────────────────────────────────────
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(process_cpu_seconds_total[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is above 80%"
          description: "Instance {{ $labels.instance }} has CPU usage above 80% for more than 5 minutes."

      # ── 5xx errors > 5/min ───────────────────────────────────────
      - alert: HighErrorRate5xx
        expr: sum(rate(tontapp_http_requests_total{status_code=~"5.."}[5m])) * 60 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate exceeds 5/min"
          description: "API is returning more than 5 server errors per minute for the last 2 minutes."

      # ── SMS failure rate > 10% ───────────────────────────────────
      - alert: HighSmsFailureRate
        expr: |
          (sum(rate(tontapp_sms_total{status="failed"}[15m])) /
           sum(rate(tontapp_sms_total[15m]))) * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SMS delivery failure rate exceeds 10%"
          description: "SMS failure rate is {{ $value | printf \"%.1f\" }}% over the last 15 minutes."

      # ── API latency p95 > 2s ─────────────────────────────────────
      - alert: HighApiLatencyP95
        expr: histogram_quantile(0.95, sum(rate(tontapp_http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency exceeds 2 seconds"
          description: "API p95 latency is {{ $value | printf \"%.2f\" }}s."

      # ── Payment failures > 10% ──────────────────────────────────
      - alert: HighPaymentFailureRate
        expr: |
          (sum(rate(tontapp_paiements_total{status="failed"}[15m])) /
           sum(rate(tontapp_paiements_total[15m]))) * 100 > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Payment failure rate exceeds 10%"
          description: "Payment failure rate is {{ $value | printf \"%.1f\" }}% over the last 15 minutes."

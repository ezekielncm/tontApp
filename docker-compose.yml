services:
  api:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - ConnectionStrings__HangfireConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-TontinesApp}
      - Jwt__Audience=${JWT_AUDIENCE:-TontinesApp}
      - AfricasTalking__ApiKey=${AFRICASTALKING_API_KEY}
      - AfricasTalking__Username=${AFRICASTALKING_USERNAME}
      - MobileMoney__ApiKey=${MOBILEMONEY_API_KEY}
      - MobileMoney__ApiSecret=${MOBILEMONEY_API_SECRET}
      - OrangeMoney__ApiKey=${ORANGEMONEY_API_KEY}
      - OrangeMoney__ApiSecret=${ORANGEMONEY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - tontapp-network

  hangfire-worker:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${IMAGE_TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - ConnectionStrings__HangfireConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Hangfire__IsWorkerOnly=true
      - AfricasTalking__ApiKey=${AFRICASTALKING_API_KEY}
      - AfricasTalking__Username=${AFRICASTALKING_USERNAME}
      - MobileMoney__ApiKey=${MOBILEMONEY_API_KEY}
      - MobileMoney__ApiSecret=${MOBILEMONEY_API_SECRET}
      - OrangeMoney__ApiKey=${ORANGEMONEY_API_KEY}
      - OrangeMoney__ApiSecret=${ORANGEMONEY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - tontapp-network
    #depends_on:
      #postgres:
        #condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tontapp-network
    
  # ===========================================================================
  # PGADMIN - PostgreSQL Management UI (Optional)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tontapp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tontapp.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tontapp-network
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tontapp-network

  # ── Dashboard (Next.js 14) ──────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8080
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8080}
      - JWT_SECRET=${JWT_SECRET_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-TontinesApp}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-TontinesApp}
      - NEXT_PUBLIC_GRAFANA_URL=http://localhost:${GRAFANA_PORT:-3001}
      - NEXT_PUBLIC_PROMETHEUS_URL=http://localhost:${PROMETHEUS_PORT:-9090}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tontapp-network

  # ── Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - tontapp-network

  # ── Grafana ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3001}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - tontapp-network

volumes:
  postgres-data:
    name: tontapp-postgres-data
  redis-data:
    name: tontapp-redis-data
  prometheus-data:
    name: tontapp-prometheus-data
  grafana-data:
    name: tontapp-grafana-data
  pgadmin_data:
    name: tontapp-pgadmin-data

networks:
  tontapp-network:
    driver: bridge
